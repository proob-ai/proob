# proob/config.toml for the Kani fixture: only the Rust adapter, so the Kani
# harness tokens are reported unbound with the reason that names the fix.
schema_version = 1
allow_self_signed = true

[[adapters]]
root = "."
language = "rust"
runner = "nextest"
mutation_tool = "cargo-mutants"

[policy]
holds = "pass"
checked = "pass"
proposed = "pass"
waived = "pass"
not_checked_within_grace = "pass"
not_checked_after_grace = "warn"
re_approve = "warn"
broken_affected = "block"
broken_unaffected = "pass"
