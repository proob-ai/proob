title = "Property-derived arguments follow the separator"
statement = "Property-derived arguments reach a child process only after the end-of-options separator."
scope = ["crates/proob-adapters/src/argv.rs", "crates/proob-adapters/src/rust/score.rs", "crates/proob-adapters/src/verus/check.rs"]
