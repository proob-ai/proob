# Continuous integration for proob.
#
# `verify` is the job to make REQUIRED in branch protection: it checks the
# verified core under --no-cheating with the pinned Verus release and proves
# the job can fail (tools/ci/verify-negative.sh). The other jobs guard the
# rest of U1: formatting, clippy, and commit messages, build and tests, the
# crate-graph layering rule, the shim, and the plugin manifests.
#
# Pull requests into any branch are checked, and so are pushes to master.
#
# Every `run:` step that executes something goes through `cargo xtask <cmd>`
# (xtask/README.md), so CI and a developer's shell run the same argv; the
# steps kept as plain shell install toolchains and tools or assert the runner's
# environment.
#
# Third-party actions are pinned to full commit SHAs; the comment names the tag.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Pinned with tools/get-verus.sh; the cache key below must change with it.
  PROOB_VERUS_VERSION: 0.2026.10.26.d17fbd0

jobs:
  lint:
    name: fmt, clippy, commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit-lint walks base..head, so the whole history must be here.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Formatting (rustfmt.toml)
        run: cargo xtask fmt
      - name: Clippy, warnings denied
        run: cargo xtask clippy
      - name: Every commit of the pull request is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask commit-lint "$BASE_SHA..$HEAD_SHA"
      - name: The pull request title is one too (it becomes the squash commit)
        if: github.event_name == 'pull_request'
        # Read from the event payload, never interpolated into the script.
        run: cargo xtask commit-lint --title "$(jq -r .pull_request.title "$GITHUB_EVENT_PATH")"

  test:
    name: build and test (plain cargo, no Verus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # cargo-mutants is what the Rust adapter's score tests drive (U5).
          tool: cargo-nextest@0.9.150,cargo-mutants@27.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the Python adapter's pinned tools (U6)
        # pytest, hypothesis, and mutmut at the versions the adapter is built for.
        run: python -m pip install -r tools/python-tools.txt
      - name: Build the binary with ghost code erased (Verus is not installed here)
        run: |
          if command -v verus >/dev/null 2>&1; then echo "verus unexpectedly on PATH" >&2; exit 1; fi
          cargo xtask build
          ./target/debug/proob --version
      - name: Test the workspace
        run: cargo xtask test
      - name: Simulate the outside world (lifecycle, honesty, shadow, soundness)
        # The built binary end to end against a fixture GitHub: real execute and
        # judge jobs with nextest and mutants, worlds that must never render
        # Holds, shadow mode leaving the repository untouched, and the 248-world
        # soundness matrix (sim/, xtask/README.md). Verdicts land in
        # target/sim/verdicts.jsonl; the SV-COMP score follows, and any Holds
        # where the world does not hold fails the job (bench/README.md, Measure 3).
        run: |
          cargo xtask sim lifecycle honesty requirement shadow soundness
          cargo xtask bench soundness

  verify:
    name: verify proob-core (required check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Cache the pinned Verus release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.proob-dev/verus
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ env.PROOB_VERUS_VERSION }}
      - name: Fetch and verify the pinned Verus release
        run: |
          dir=$(tools/get-verus.sh)
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/verus" --version
      - name: Verify proob-core under --no-cheating
        # Runs `cargo verus verify --locked -p proob-core --fwd-verus-args-to roots
        # -- --no-cheating --rlimit 10` (xtask/src/plan.rs). --fwd-verus-args-to
        # roots scopes --no-cheating to proob-core: forwarded to all crates it
        # would reject vstd's own admits before reaching our code.
        run: cargo xtask verify
      - name: Trusted base size (growth here is growth of what is assumed)
        run: cargo xtask trusted-base
      - name: The verify job can fail
        run: cargo xtask verify-negative

  crate-graph:
    name: crate graph layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo xtask crate-graph
      - name: README translations match README.md
        run: cargo xtask readme-sync

  shim:
    name: shim (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]  # arm64 macOS runners never start for this private repository
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo xtask shim-tests
      - run: cargo xtask hook-tests

  action-self-test:
    # Not required. Exercises action.yml's download-free path with the binary
    # built from this very commit: `execute` then `judge`, in the mode this
    # event calls for (check on a pull request, evidence on push and dispatch).
    # The declaration is taken out of the working tree first, so both jobs
    # take the "nothing is governed" path: exit 0, a summary that says so,
    # and `verdict=pass` with `mode=none` from the judge. proob's real
    # declaration is exercised by proob-gate.yml and proob-evidence.yml (with
    # both adapters' toolchains) and by the `declaration` job below. Execute
    # runs with no token in its environment, judge with the read-only one.
    name: action self-test (download-free path)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROOB_SELF_TEST_MODE: ${{ github.event_name == 'pull_request' && 'check' || 'evidence' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Build proob from this commit
        run: cargo xtask build
      - name: Take proob's own declaration out of the working tree
        # Only the plumbing is under test here: with proob/config.toml and
        # proob/properties/ gone, nothing is governed and no adapter runs.
        run: rm -rf proob
      - name: Execute (no token in the environment)
        id: execute
        uses: ./
        with:
          binary: target/debug/proob
          mode: ${{ env.PROOB_SELF_TEST_MODE }}
          job: execute
      - name: Judge (read-only token)
        id: judge
        uses: ./
        with:
          binary: target/debug/proob
          mode: ${{ env.PROOB_SELF_TEST_MODE }}
          job: judge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The jobs took the no-proob-directory path and said so
        env:
          EXECUTE_HEADLINE: ${{ steps.execute.outputs.headline }}
          JUDGE_VERDICT: ${{ steps.judge.outputs.verdict }}
          JUDGE_MODE: ${{ steps.judge.outputs.mode }}
          JUDGE_HEADLINE: ${{ steps.judge.outputs.headline }}
        run: |
          set -euo pipefail
          echo "execute: $EXECUTE_HEADLINE"
          echo "judge:   $JUDGE_HEADLINE ($JUDGE_MODE, $JUDGE_VERDICT)"
          [ -f proob/.cache/results/manifest.json ] || { echo "execute wrote no manifest" >&2; exit 1; }
          [ "$JUDGE_VERDICT" = pass ] || { echo "expected verdict=pass, got '$JUDGE_VERDICT'" >&2; exit 1; }
          [ "$JUDGE_MODE" = none ] || { echo "expected mode=none (no proob/ directory yet), got '$JUDGE_MODE'" >&2; exit 1; }
          case "$JUDGE_HEADLINE" in *"no proob/ directory"*) ;; *) echo "unexpected headline" >&2; exit 1 ;; esac

  declaration:
    # Not required. proob's own declaration (proob/config.toml, proob/properties/,
    # the binding tokens in the sources) always parses, and the unverified path
    # (no token: `status` renders Unverified and never Holds) is exercised on
    # every pull request. The verified path runs in proob-gate.yml.
    name: proob's own declaration parses (no token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `status` reads origin/master: the default branch must be reachable.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Build proob, validate the declaration, derive status with no token
        # Refuses if a token reached the job, then requires `status --json` to
        # say "state": "unverified" and never "word": "holds" (xtask/src/plan.rs).
        run: cargo xtask declaration

  bench-replay:
    # Not required. Every bug proob has caught (bench/corpus/), replayed with
    # no LLM: the property and the agent's tests on the buggy commit must find a
    # counterexample, and for a catch the fixed commit must not (bench/README.md,
    # "Regression corpus"). The cache holds the clones, venvs, and Cargo builds;
    # all of it is regenerable.
    name: bench replay (regression corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.150
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (the replayer builds each Python repository's venv with it)
        run: python -m pip install uv==0.9.2
      - name: Cache the replay clones, venvs, and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/proob-bench
          key: bench-replay-${{ runner.os }}-${{ hashFiles('bench/corpus/*/entry.toml', 'tools/python-tools.txt', 'rust-toolchain.toml') }}
          restore-keys: bench-replay-${{ runner.os }}-
      - name: Replay the corpus
        run: cargo xtask bench replay

  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Validate the plugin and marketplace manifests
        # Runs unauthenticated: validate reads only the manifests. xtask uses
        # `claude` from PATH, else $HOME/.local/bin/claude where install.sh puts it.
        run: cargo xtask plugin-validate
