[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist). Reference:
# https://axodotdev.github.io/cargo-dist/book/reference/config.html
[dist]
# The dist version CI installs; bump together with the local tool.
cargo-dist-version = "0.33.1"
# CI backend; release.yml is generated by `dist generate` and committed.
ci = "github"
# Installers for teams that prefer them; the plugin shim and the Action use the
# raw archives and checksums below. Homebrew needs a tap repo: deferred to U13.
installers = ["shell", "powershell"]
# Static Linux builds (musl), both macOS architectures, Windows x86_64.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# One proob-<target>.<archive>.sha256 per archive, plus a unified sha256.sum.
checksum = "sha256"
# GitHub artifact attestations (Sigstore): every release archive gets a signed
# build record, which the shim checks with `gh attestation verify` whenever
# gh is authenticated (it refuses an archive without one). They were off for
# v0.1.0, released while the repository was private.
github-attestations = true
# Where to host releases
hosting = "github"
# Script installers install here when a team uses them.
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Pull requests run `dist plan` only; builds happen on tags.
pr-run-mode = "plan"

# arm64 macOS runners never start for this private repository (the v0.1.0
# release job sat queued on macos-14 and macos-15, and CI's macos-latest shim
# job was cancelled unstarted), while macos-15-intel runs at once. Cross-compile
# the arm64 binary there; revisit when the repository is public.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15-intel"
