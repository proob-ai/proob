rationale = "CHANGELOG.md lists more than a dozen serialization fixes after edits (#486, #504, #513, #524, #533, #542, #543, #545), and a comment in tomlkit/container.py notes that new tables must appear after all entries that render inline. A failure silently re-nests or loses keys in written config."
