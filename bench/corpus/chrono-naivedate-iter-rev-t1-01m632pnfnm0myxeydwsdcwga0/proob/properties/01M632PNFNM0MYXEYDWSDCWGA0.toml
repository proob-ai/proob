id = "01M632PNFNM0MYXEYDWSDCWGA0"
title = "Week sequence reversed"
statement = "Reading a run of weekly dates from the back yields exactly the weekly dates read from the front, in reverse order."
scope = ["src/naive/date/mod.rs"]
severity = "high"
rationale = "The week iterator in src/naive/date/mod.rs declares itself double-ended but its next_back subtracts seven days from the single cursor instead of reversing the forward items; test_week_iterator_limit in src/naive/date/tests.rs relies on the backward walk from MIN_YEAR-01-15."
